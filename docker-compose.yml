x-app: &app-service
  image: bullsmedia-app:local
  restart: unless-stopped
  environment: &app-environment
    APP_DEBUG: 'false'
    APP_URL: http://localhost:${APP_PORT:-8080}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: bullsmedia
    DB_USERNAME: bullsmedia
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    DB_URL: ''
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: 660
    GOOGLE_CREDENTIALS_PATH: /var/www/html/storage/app/google/credentials.json
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bullsmedia.test}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
    AUTORUN_ENABLED: 'false'
    SSL_MODE: 'off'
  volumes:
    - ./storage/app/google:/var/www/html/storage/app/google:ro
    - app_logs:/var/www/html/storage/logs
    - app_runtime:/var/www/html/docker/runtime

services:
  mysql:
    image: mysql:8.4
    container_name: bullsmedia-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bullsmedia
      MYSQL_USER: bullsmedia
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *app-service
    build:
      context: .
      target: app
    environment:
      <<: *app-environment
      BULLSMEDIA_BOOTSTRAP: 'true'
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/up']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  queue:
    <<: *app-service
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=600']
    # depends_on:
    #   app:
    #     condition: service_healthy
    # healthcheck:
    #   disable: true
    stop_grace_period: 610s

  scheduler:
    <<: *app-service
    command: ['php', 'artisan', 'schedule:work']
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  mysql_data:
  app_logs:
  app_runtime: